name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only. Nothing connects to a database during
      # `next build` — every route is dynamic — but src/db/index.ts and
      # src/lib/session.ts validate these at import time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-0000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npx next build
      - name: Dice engine unit tests (no browser, no DB)
        run: npx playwright test tests/dice.spec.ts --reporter=line
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
