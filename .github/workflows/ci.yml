name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, gates, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only. Nothing connects to a database during
      # `next build` — every route is dynamic — but src/db/index.ts and
      # src/lib/session.ts validate these at import time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-0000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npx next build
      - name: Design-system gates and colour contrast (static, no DB)
        run: |
          npm run check:design
          npm run check:contrast
      - name: Pure-logic specs (no server, no DB)
        # Every spec that needs neither a running app nor a database. Add new
        # pure-logic specs here so they gate every pull request.
        run: >-
          npx playwright test
          tests/dice.spec.ts
          tests/design-gates.spec.ts
          tests/design-tokens.spec.ts
          tests/map-geometry.spec.ts
          tests/statblock.spec.ts
          tests/roll-table.spec.ts
          tests/relations-core.spec.ts
          tests/character-engine.spec.ts
          tests/character-world-core.spec.ts
          tests/image-size.spec.ts
          --reporter=line
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
