<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Georgia, 'Times New Roman', serif">
  <!-- ============ THE SHEET: aged vellum ============ -->
  <rect width="1600" height="1000" fill="#e8d9b0"/>
  <ellipse cx="310" cy="820" rx="230" ry="110" fill="#c9a96e" opacity="0.14"/>
  <ellipse cx="1330" cy="240" rx="180" ry="90" fill="#c9a96e" opacity="0.12"/>
  <ellipse cx="880" cy="80" rx="260" ry="60" fill="#d8c491" opacity="0.25"/>
  <ellipse cx="120" cy="120" rx="90" ry="70" fill="#b98d5f" opacity="0.10"/>
  <rect x="18" y="18" width="1564" height="964" fill="none" stroke="#4a3222" stroke-width="2.5"/>
  <rect x="26" y="26" width="1548" height="948" fill="none" stroke="#4a3222" stroke-width="1" opacity="0.5"/>

  <text x="60" y="70" font-size="26" fill="#4a3222" letter-spacing="6">THE ALETHEION &#8212; MOUSEION OF THE CONCORD</text>
  <text x="60" y="94" font-size="13" fill="#6a4a2f" letter-spacing="3">&#932;&#927; &#913;&#923;&#919;&#920;&#917;&#921;&#927;&#925; &#183; SURVEYED FOR THE OFFICE OF WORKS, HELARCHON &#183; THE THIRD SHEET OF SEVEN</text>

  <!-- compass -->
  <g transform="translate(1530,72)" stroke="#4a3222" fill="none" stroke-width="1.5">
    <circle r="16"/>
    <path d="M0 12 L0 -14 M-5 -6 L0 -14 L5 -6"/>
  </g>
  <text x="1530" y="106" font-size="11" fill="#4a3222" text-anchor="middle">N</text>

  <!-- ============ GROUND PLAN (left, scale .75) ============ -->
  <g transform="translate(60,150) scale(0.75)">
    <text x="0" y="-16" font-size="17" fill="#4a3222" letter-spacing="3">THE GROUND FLOOR</text>
    <g fill="none" stroke="#4a3222" stroke-width="4">
      <rect x="0" y="0" width="144" height="120"/>
      <rect x="144" y="0" width="96" height="120"/>
      <rect x="240" y="0" width="120" height="120"/>
      <rect x="360" y="0" width="168" height="120"/>
      <rect x="0" y="120" width="528" height="72"/>
      <rect x="528" y="72" width="144" height="120"/>
      <rect x="0" y="192" width="216" height="384"/>
      <rect x="600" y="192" width="216" height="384"/>
      <circle cx="408" cy="384" r="192"/>
      <rect x="264" y="576" width="288" height="48"/>
    </g>
    <!-- door gaps -->
    <g fill="#e8d9b0">
      <rect x="46" y="112" width="50" height="16"/><rect x="166" y="112" width="50" height="16"/>
      <rect x="274" y="112" width="50" height="16"/><rect x="418" y="112" width="50" height="16"/>
      <rect x="46" y="184" width="50" height="16"/>
      <rect x="520" y="142" width="16" height="44"/>
      <rect x="664" y="106" width="16" height="50"/>
      <rect x="610" y="184" width="50" height="16"/>
      <rect x="382" y="178" width="52" height="26"/>
      <rect x="206" y="358" width="22" height="52"/>
      <rect x="588" y="358" width="22" height="52"/>
      <rect x="382" y="562" width="52" height="26"/>
    </g>
    <!-- door swings -->
    <g stroke="#4a3222" stroke-width="1.2" fill="none" opacity="0.6">
      <path d="M46 120 A50 50 0 0 1 96 170"/>
      <path d="M274 120 A50 50 0 0 1 324 170"/>
    </g>
    <!-- stairs -->
    <g stroke="#4a3222" stroke-width="1.4" fill="none">
      <path d="M150 30 h84 M150 44 h84 M150 58 h84 M150 72 h84 M150 86 h84 M150 100 h84"/>
      <path d="M76 56 h56 M76 68 h56 M76 80 h56 M76 92 h56 M76 104 h56"/>
    </g>
    <text x="187" y="22" font-size="10.5" fill="#4a3222" opacity="0.85" text-anchor="middle">STAIR, UP</text>
    <text x="104" y="48" font-size="9.5" fill="#4a3222" opacity="0.85" text-anchor="middle">STAIR, DN.</text>
    <!-- oculus -->
    <circle cx="408" cy="384" r="72" fill="none" stroke="#4a3222" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="408" y="380" font-size="11" fill="#4a3222" opacity="0.85" text-anchor="middle">GLAZED OCULUS ABOVE</text>
    <!-- statue plinths -->
    <g fill="none" stroke="#4a3222" stroke-width="1.6">
      <rect x="299" y="275" width="24" height="24"/><rect x="493" y="275" width="24" height="24"/>
      <rect x="299" y="469" width="24" height="24"/><rect x="493" y="469" width="24" height="24"/>
    </g>
    <text x="408" y="332" font-size="10" fill="#4a3222" opacity="0.8" text-anchor="middle">STATVARY (4) &#8212; SEE NOTE V</text>
    <!-- casework, dashed -->
    <g fill="none" stroke="#6a4a2f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7">
      <rect x="12" y="222" width="18" height="336"/><rect x="786" y="222" width="18" height="336"/>
      <rect x="96" y="270" width="36" height="120"/><rect x="648" y="270" width="36" height="96"/>
    </g>
    <!-- portico columns -->
    <g fill="none" stroke="#4a3222" stroke-width="1.6">
      <circle cx="276" cy="600" r="7"/><circle cx="324" cy="600" r="7"/><circle cx="372" cy="600" r="7"/>
      <circle cx="444" cy="600" r="7"/><circle cx="492" cy="600" r="7"/><circle cx="540" cy="600" r="7"/>
    </g>
    <!-- labels -->
    <g fill="#4a3222" font-size="13" letter-spacing="2">
      <text x="14" y="20">GUARD RM.</text>
      <text x="248" y="20">CURATOR</text>
      <text x="368" y="20">WORKSHOP</text>
      <text x="540" y="96">SERVICE DOCK</text>
      <text x="12" y="142">CORRIDOR</text>
      <text x="12" y="214">GALLERY I &#8212; FOUNDERS&#8217; HALL</text>
      <text x="608" y="214">GALLERY II &#8212; STORM-STAR</text>
      <text x="408" y="420" text-anchor="middle">ROTUNDA OF THE CONCORD</text>
      <text x="408" y="614" text-anchor="middle" font-size="11">PORTICO &#183; BRONZE DOORS</text>
    </g>
    <!-- dimension line -->
    <g stroke="#4a3222" stroke-width="1" opacity="0.8">
      <line x1="0" y1="648" x2="816" y2="648"/>
      <line x1="0" y1="640" x2="0" y2="656"/><line x1="816" y1="640" x2="816" y2="656"/>
    </g>
    <text x="408" y="668" font-size="11" fill="#4a3222" text-anchor="middle" letter-spacing="2">ONE HUNDRED &#38; SEVENTY FEET</text>
  </g>

  <!-- ============ UPPER PLAN (right top, scale .60) ============ -->
  <g transform="translate(720,140) scale(0.60)">
    <text x="0" y="-16" font-size="17" fill="#4a3222" letter-spacing="3">THE UPPER FLOOR</text>
    <g fill="none" stroke="#4a3222" stroke-width="4">
      <rect x="0" y="0" width="192" height="120"/>
      <rect x="192" y="0" width="336" height="120"/>
      <rect x="0" y="120" width="528" height="72"/>
      <circle cx="408" cy="384" r="192"/>
    </g>
    <circle cx="408" cy="384" r="120" fill="none" stroke="#4a3222" stroke-width="1.6" stroke-dasharray="9 6"/>
    <text x="408" y="380" font-size="12" fill="#4a3222" opacity="0.85" text-anchor="middle">OPEN TO ROTUNDA</text>
    <circle cx="408" cy="384" r="72" fill="none" stroke="#4a3222" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/>
    <text x="408" y="470" font-size="10.5" fill="#4a3222" opacity="0.75" text-anchor="middle">OCULUS</text>
    <!-- roofs dashed -->
    <g fill="none" stroke="#6a4a2f" stroke-width="1.4" stroke-dasharray="10 7" opacity="0.65">
      <rect x="0" y="192" width="216" height="384"/>
      <rect x="600" y="192" width="216" height="384"/>
      <rect x="264" y="576" width="288" height="48"/>
    </g>
    <g fill="#e8d9b0">
      <rect x="46" y="112" width="50" height="16"/>
      <rect x="274" y="112" width="50" height="16"/>
      <rect x="382" y="178" width="52" height="26"/>
    </g>
    <g stroke="#4a3222" stroke-width="1.4" fill="none">
      <path d="M150 132 h84 M150 144 h84 M150 156 h84 M150 168 h84 M150 180 h84"/>
    </g>
    <text x="192" y="128" font-size="10.5" fill="#4a3222" opacity="0.85" text-anchor="middle">STAIR, DN.</text>
    <g fill="#4a3222" font-size="13" letter-spacing="2">
      <text x="14" y="20">LABEL RM.</text>
      <text x="200" y="20">ARCHIVE &#8212; RESTRICTED</text>
      <text x="204" y="40" font-size="10" opacity="0.8">(ADMITTANCE BY WRIT ONLY)</text>
      <text x="408" y="240" text-anchor="middle">GALLERY III &#8212; VIOLET DUSK</text>
      <text x="20" y="220" font-size="10.5" opacity="0.75">ROOF, WEST WING</text>
      <text x="620" y="220" font-size="10.5" opacity="0.75">ROOF, EAST WING</text>
    </g>
  </g>

  <!-- ============ UNDERCROFT PLAN (right bottom, scale .60) ============ -->
  <g transform="translate(720,560) scale(0.60)">
    <text x="0" y="-16" font-size="17" fill="#4a3222" letter-spacing="3">THE UNDERCROFT</text>
    <g fill="none" stroke="#4a3222" stroke-width="4">
      <rect x="0" y="0" width="240" height="192"/>
      <rect x="264" y="0" width="72" height="96"/>
      <rect x="240" y="96" width="48" height="144"/>
      <rect x="0" y="192" width="96" height="48"/>
      <rect x="0" y="240" width="96" height="288"/>
      <rect x="192" y="240" width="384" height="240"/>
    </g>
    <g fill="#e8d9b0">
      <rect x="22" y="184" width="50" height="16"/>
      <rect x="22" y="232" width="50" height="16"/>
      <rect x="264" y="88" width="24" height="16"/>
      <rect x="242" y="232" width="44" height="16"/>
    </g>
    <g stroke="#4a3222" stroke-width="1.4" fill="none">
      <path d="M270 18 h60 M270 32 h60 M270 46 h60 M270 60 h60 M270 74 h60"/>
    </g>
    <text x="300" y="12" font-size="10.5" fill="#4a3222" opacity="0.85" text-anchor="middle">STAIR, UP</text>
    <!-- casework dashed; the store is otherwise EMPTY on the survey -->
    <g fill="none" stroke="#6a4a2f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.65">
      <rect x="204" y="258" width="18" height="120"/><rect x="546" y="258" width="18" height="120"/>
    </g>
    <!-- grate -->
    <g stroke="#4a3222" stroke-width="1.6">
      <line x1="24" y1="514" x2="24" y2="528"/><line x1="36" y1="514" x2="36" y2="528"/>
      <line x1="48" y1="514" x2="48" y2="528"/><line x1="60" y1="514" x2="60" y2="528"/>
    </g>
    <g fill="#4a3222" font-size="13" letter-spacing="2">
      <text x="14" y="22">STORES</text>
      <text x="10" y="278" font-size="10.5" opacity="0.85">CISTERN</text>
      <text x="10" y="292" font-size="10.5" opacity="0.85">OVERFLOW</text>
      <text x="10" y="306" font-size="10.5" opacity="0.85">(DISUSED)</text>
      <text x="106" y="524" font-size="10" opacity="0.85">IRON GRATE &#8212; NOTE III</text>
      <text x="384" y="268" text-anchor="middle">CONSERVATION STORE B &#8212; SEE NOTE IV</text>
    </g>
  </g>

  <!-- ============ SURVEYOR'S NOTES (far right column) ============ -->
  <g transform="translate(1290,140)">
    <text x="0" y="0" font-size="15" fill="#4a3222" letter-spacing="3">THE SURVEYOR&#8217;S NOTES</text>
    <line x1="0" y1="10" x2="252" y2="10" stroke="#4a3222" stroke-width="1"/>
    <g fill="#4a3222" font-size="11.5" opacity="0.92">
      <text x="0" y="36">I. ONE SQUARE OF THE SURVEY</text>
      <text x="16" y="51">STANDS FOR FIVE FEET.</text>
      <text x="0" y="80">II. THE OCULUS IS GLAZED; ITS</text>
      <text x="16" y="95">LANTERN IS SERVICED FROM</text>
      <text x="16" y="110">THE ROOF, NOT WITHIN.</text>
      <text x="0" y="139">III. THE CISTERN OVERFLOW IS</text>
      <text x="16" y="154">DISUSED SINCE THE OLD</text>
      <text x="16" y="169">SURVEY. GRATE RUSTED FAST.</text>
      <text x="0" y="198">IV. THE LOWER STORE IS NEWLY</text>
      <text x="16" y="213">RELABELED BY DECREE. OF ITS</text>
      <text x="16" y="228">CONTENTS, ASK THE CURATOR.</text>
      <text x="0" y="257">V. THE ROTUNDA STATUARY (4):</text>
      <text x="16" y="272">PLINTHS RE-SET AT DAWN,</text>
      <text x="16" y="287">DAILY, PER THE LOG.</text>
    </g>
    <!-- marginalia in another, later hand -->
    <g fill="#5a4a3a" font-size="12.5" font-style="italic">
      <text x="30" y="243" transform="rotate(-2 30 243)">&#8220;of its contents&#8221; &#8212; ask Eupraxia</text>
      <text x="30" y="304" transform="rotate(-1 30 304)">re-set daily? why &#8212; D.</text>
    </g>
    <!-- archive seal: red wax and ochre stamp -->
    <g transform="translate(30,346)">
      <circle cx="24" cy="24" r="22" fill="#9c3d2a" opacity="0.85"/>
      <circle cx="24" cy="24" r="15" fill="none" stroke="#e8d9b0" stroke-width="1.5" opacity="0.7"/>
      <path d="M24 12 L28 22 L38 22 L30 28 L33 38 L24 32 L15 38 L18 28 L10 22 L20 22 Z" fill="#e8d9b0" opacity="0.35"/>
      <g transform="translate(58,4) rotate(-5)" fill="#9c3d2a">
        <text x="0" y="14" font-size="13" letter-spacing="2">COPY &#8212; SCHOLARS&#8217;</text>
        <text x="0" y="32" font-size="13" letter-spacing="2">ARCHIVE. NOT FOR</text>
        <text x="0" y="50" font-size="13" letter-spacing="2">CIRCULATION.</text>
      </g>
    </g>
  </g>

  <!-- ============ TITLE BLOCK ============ -->
  <g transform="translate(60,908)">
    <rect x="0" y="0" width="1480" height="54" fill="none" stroke="#4a3222" stroke-width="2"/>
    <line x1="500" y1="0" x2="500" y2="54" stroke="#4a3222" stroke-width="1.2"/>
    <line x1="900" y1="0" x2="900" y2="54" stroke="#4a3222" stroke-width="1.2"/>
    <line x1="1200" y1="0" x2="1200" y2="54" stroke="#4a3222" stroke-width="1.2"/>
    <g fill="#4a3222">
      <text x="16" y="22" font-size="12" letter-spacing="2">THE OFFICE OF WORKS AT HELARCHON</text>
      <text x="16" y="42" font-size="10.5" opacity="0.8">MUSEUM HILL, THE SCHOLARS&#8217; DISTRICT</text>
      <text x="516" y="22" font-size="12" letter-spacing="2">DRAWN BY P. DEXAMENOS</text>
      <text x="516" y="42" font-size="10.5" opacity="0.8">OF THE GUILD OF MASONS, FOURTH CHAIR</text>
      <text x="916" y="22" font-size="12" letter-spacing="2">THE THIRD SHEET OF SEVEN</text>
      <text x="916" y="42" font-size="10.5" opacity="0.8">PLANS: GROUND &#183; UPPER &#183; UNDERCROFT</text>
      <text x="1216" y="22" font-size="12" letter-spacing="2">ONE SQUARE = FIVE FEET</text>
      <text x="1216" y="42" font-size="10.5" opacity="0.8">MEASURED BY ROD &#38; CHAIN</text>
    </g>
  </g>
</svg>
