<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid" x="42" y="60" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#5a482f" stroke-width="0.7" opacity="0.16"/>
    </pattern>
    <pattern id="roofhatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0" stroke="#a29478" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="740" fill="#efe7d2"/>
  <text x="42" y="34" font-size="19" fill="#4a3a28" letter-spacing="2">THE ALETHEION &#8212; GROUND FLOOR</text>
  <text x="858" y="34" text-anchor="end" font-size="12" fill="#7a6748" font-style="italic">1 square = 5 ft &#183; battle map, player-safe</text>

  <!-- ================= FLOOR FILLS ================= -->
  <!-- north rooms -->
  <rect x="42" y="60" width="144" height="120" fill="#e6d9bc"/>
  <rect x="186" y="60" width="96" height="120" fill="#e6d9bc"/>
  <rect x="282" y="60" width="120" height="120" fill="#e6d9bc"/>
  <rect x="402" y="60" width="168" height="120" fill="#e6d9bc"/>
  <!-- corridor -->
  <rect x="42" y="180" width="528" height="72" fill="#e6d9bc"/>
  <!-- service dock -->
  <rect x="570" y="132" width="144" height="120" fill="#e6d9bc"/>
  <!-- masonry heart + rotunda -->
  <rect x="258" y="252" width="384" height="384" fill="#c9b995"/>
  <circle cx="450" cy="444" r="192" fill="#e9dfc8"/>
  <!-- wings -->
  <rect x="42" y="252" width="216" height="384" fill="#e6d9bc"/>
  <rect x="642" y="252" width="216" height="384" fill="#e6d9bc"/>
  <!-- portico -->
  <rect x="306" y="636" width="288" height="48" fill="#e0d2b1"/>

  <!-- mosaic rings -->
  <circle cx="450" cy="444" r="96" fill="#dcd0b0"/>
  <circle cx="450" cy="444" r="48" fill="#e9dfc8"/>
  <circle cx="450" cy="444" r="96" fill="none" stroke="#b8a67f" stroke-width="2"/>
  <circle cx="450" cy="444" r="48" fill="none" stroke="#b8a67f" stroke-width="2"/>

  <!-- ================= GRID ================= -->
  <rect x="42" y="60" width="144" height="120" fill="url(#grid)"/>
  <rect x="186" y="60" width="96" height="120" fill="url(#grid)"/>
  <rect x="282" y="60" width="120" height="120" fill="url(#grid)"/>
  <rect x="402" y="60" width="168" height="120" fill="url(#grid)"/>
  <rect x="42" y="180" width="528" height="72" fill="url(#grid)"/>
  <rect x="570" y="132" width="144" height="120" fill="url(#grid)"/>
  <circle cx="450" cy="444" r="192" fill="url(#grid)"/>
  <rect x="42" y="252" width="216" height="384" fill="url(#grid)"/>
  <rect x="642" y="252" width="216" height="384" fill="url(#grid)"/>
  <rect x="306" y="636" width="288" height="48" fill="url(#grid)"/>

  <!-- ================= WALLS ================= -->
  <g fill="none" stroke="#4a3a28" stroke-width="5" stroke-linecap="square">
    <rect x="42" y="60" width="144" height="120"/>
    <rect x="186" y="60" width="96" height="120"/>
    <rect x="282" y="60" width="120" height="120"/>
    <rect x="402" y="60" width="168" height="120"/>
    <rect x="42" y="180" width="528" height="72"/>
    <rect x="570" y="132" width="144" height="120"/>
    <rect x="42" y="252" width="216" height="384"/>
    <rect x="642" y="252" width="216" height="384"/>
    <circle cx="450" cy="444" r="192"/>
    <rect x="306" y="636" width="288" height="48"/>
  </g>

  <!-- ================= DOOR OPENINGS ================= -->
  <g>
    <rect x="88" y="172" width="50" height="16" fill="#e6d9bc"/>
    <rect x="208" y="172" width="50" height="16" fill="#e6d9bc"/>
    <rect x="316" y="172" width="50" height="16" fill="#e6d9bc"/>
    <rect x="460" y="172" width="50" height="16" fill="#e6d9bc"/>
    <rect x="88" y="244" width="50" height="16" fill="#e6d9bc"/>
    <rect x="562" y="202" width="16" height="44" fill="#e6d9bc"/>
    <rect x="706" y="166" width="16" height="50" fill="#e6d9bc"/>
    <rect x="652" y="244" width="50" height="16" fill="#e6d9bc"/>
    <rect x="424" y="240" width="52" height="24" fill="#e6d9bc"/>
    <rect x="248" y="418" width="22" height="52" fill="#e9dfc8"/>
    <rect x="630" y="418" width="22" height="52" fill="#e9dfc8"/>
    <rect x="424" y="624" width="52" height="24" fill="#e9dfc8"/>
  </g>
  <g stroke="#8a6d3b" stroke-width="2.5">
    <line x1="88" y1="180" x2="138" y2="180"/><line x1="208" y1="180" x2="258" y2="180"/>
    <line x1="316" y1="180" x2="366" y2="180"/><line x1="460" y1="180" x2="510" y2="180"/>
    <line x1="88" y1="252" x2="138" y2="252"/>
    <line x1="570" y1="202" x2="570" y2="246"/>
    <line x1="714" y1="166" x2="714" y2="216"/>
    <line x1="652" y1="252" x2="702" y2="252"/>
  </g>

  <!-- ================= FURNITURE & EXHIBITS ================= -->
  <!-- guard room: table, rack, stair down -->
  <rect x="126" y="126" width="42" height="24" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <g stroke="#8a6d3b" stroke-width="1.5"><rect x="54" y="72" width="60" height="42" fill="#ddcda8"/>
    <line x1="54" y1="82" x2="114" y2="82"/><line x1="54" y1="92" x2="114" y2="92"/><line x1="54" y1="102" x2="114" y2="102"/></g>
  <text x="60" y="126" font-size="9" fill="#6a5537" font-style="italic">stairs down</text>

  <!-- grand stair -->
  <g stroke="#8a6d3b" stroke-width="1.5" fill="none">
    <line x1="192" y1="90" x2="276" y2="90"/><line x1="192" y1="104" x2="276" y2="104"/>
    <line x1="192" y1="118" x2="276" y2="118"/><line x1="192" y1="132" x2="276" y2="132"/>
    <line x1="192" y1="146" x2="276" y2="146"/><line x1="192" y1="160" x2="276" y2="160"/>
  </g>
  <text x="234" y="80" text-anchor="middle" font-size="9" fill="#6a5537" font-style="italic">stairs up</text>

  <!-- curator: desk + chair + cabinet -->
  <rect x="300" y="90" width="54" height="24" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <circle cx="327" cy="130" r="8" fill="#ddcda8" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="372" y="66" width="24" height="48" fill="#b98d5f" stroke="#8a6d3b" stroke-width="1.5"/>

  <!-- workshop: benches + crates -->
  <rect x="414" y="78" width="66" height="24" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="480" y="126" width="66" height="24" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="414" y="132" width="22" height="22" fill="#d8c49a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="438" y="140" width="22" height="22" fill="#d8c49a" stroke="#8a6d3b" stroke-width="1.5"/>

  <!-- service dock: crates + handcart -->
  <rect x="582" y="144" width="22" height="22" fill="#d8c49a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="606" y="144" width="22" height="22" fill="#d8c49a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="582" y="168" width="22" height="22" fill="#d8c49a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="660" y="216" width="40" height="20" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>

  <!-- rotunda: hoplite plinths + skylight -->
  <g stroke="#8a6d3b" stroke-width="1.5">
    <rect x="341" y="335" width="24" height="24" fill="#d3c49f"/><circle cx="353" cy="347" r="8" fill="#8a6d3b"/>
    <rect x="535" y="335" width="24" height="24" fill="#d3c49f"/><circle cx="547" cy="347" r="8" fill="#8a6d3b"/>
    <rect x="341" y="529" width="24" height="24" fill="#d3c49f"/><circle cx="353" cy="541" r="8" fill="#8a6d3b"/>
    <rect x="535" y="529" width="24" height="24" fill="#d3c49f"/><circle cx="547" cy="541" r="8" fill="#8a6d3b"/>
  </g>
  <circle cx="450" cy="444" r="72" fill="none" stroke="#6a5537" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="450" y="440" text-anchor="middle" font-size="9.5" fill="#6a5537" font-style="italic">skylight far above</text>

  <!-- founders' hall cases -->
  <g stroke="#8a6d3b" stroke-width="1.5" fill="#f6efdd">
    <rect x="54" y="282" width="18" height="84"/><rect x="54" y="390" width="18" height="84"/><rect x="54" y="498" width="18" height="84"/>
    <rect x="138" y="330" width="36" height="120"/>
    <rect x="204" y="282" width="24" height="36"/>
  </g>
  <ellipse cx="150" cy="566" rx="62" ry="22" fill="#c9a06a" stroke="#8a6d3b" stroke-width="2"/>
  <text x="150" y="570" text-anchor="middle" font-size="9" fill="#4a3a28" font-style="italic">the Oath-Prow</text>
  <text x="216" y="308" font-size="8.5" fill="#6a5537" font-style="italic" transform="rotate(90 216 308)">stele</text>

  <!-- hall of the storm-star cases -->
  <g stroke="#8a6d3b" stroke-width="1.5" fill="#f6efdd">
    <rect x="828" y="282" width="18" height="84"/><rect x="828" y="390" width="18" height="84"/><rect x="828" y="498" width="18" height="84"/>
    <rect x="690" y="330" width="36" height="96"/>
    <rect x="762" y="540" width="24" height="48"/>
  </g>
  <rect x="672" y="606" width="132" height="12" fill="#d9e2e6" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="738" y="600" text-anchor="middle" font-size="8.5" fill="#6a5537" font-style="italic">the Silent Sail</text>
  <text x="708" y="320" font-size="8.5" fill="#6a5537" font-style="italic">mantle</text>

  <!-- portico columns + steps -->
  <g fill="#d3c49f" stroke="#8a6d3b" stroke-width="1.5">
    <circle cx="318" cy="660" r="7"/><circle cx="366" cy="660" r="7"/><circle cx="414" cy="660" r="7"/>
    <circle cx="486" cy="660" r="7"/><circle cx="534" cy="660" r="7"/><circle cx="582" cy="660" r="7"/>
  </g>
  <g stroke="#b8a67f" stroke-width="2"><line x1="306" y1="692" x2="594" y2="692"/><line x1="306" y1="700" x2="594" y2="700"/></g>

  <!-- ================= LABELS ================= -->
  <g fill="#6a5537" font-size="11.5" letter-spacing="1">
    <text x="60" y="78">GUARD ROOM</text>
    <text x="290" y="78">CURATOR</text>
    <text x="410" y="76">WORKSHOP</text>
    <text x="586" y="126" font-size="10">SERVICE DOCK</text>
    <text x="60" y="200">CORRIDOR</text>
    <text x="52" y="274">FOUNDERS&#8217; HALL</text>
    <text x="652" y="274">HALL OF THE STORM-STAR</text>
    <text x="450" y="376" text-anchor="middle">ROTUNDA OF THE CONCORD</text>
    <text x="450" y="678" text-anchor="middle" font-size="10">PORTICO &#183; BRONZE DOORS</text>
  </g>
</svg>
