<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid" x="42" y="60" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#5a482f" stroke-width="0.7" opacity="0.16"/>
    </pattern>
    <pattern id="roofhatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0" stroke="#a29478" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="740" fill="#efe7d2"/>
  <text x="42" y="34" font-size="19" fill="#4a3a28" letter-spacing="2">THE ALETHEION &#8212; UPPER FLOOR</text>
  <text x="858" y="34" text-anchor="end" font-size="12" fill="#7a6748" font-style="italic">1 square = 5 ft &#183; battle map, player-safe</text>

  <!-- ================= ROOF AREAS (not walkable floor, climbable) ================= -->
  <rect x="42" y="252" width="216" height="384" fill="#ddd3bd"/>
  <rect x="42" y="252" width="216" height="384" fill="url(#roofhatch)"/>
  <rect x="642" y="252" width="216" height="384" fill="#ddd3bd"/>
  <rect x="642" y="252" width="216" height="384" fill="url(#roofhatch)"/>
  <rect x="306" y="636" width="288" height="48" fill="#ddd3bd"/>
  <rect x="306" y="636" width="288" height="48" fill="url(#roofhatch)"/>
  <text x="150" y="450" text-anchor="middle" font-size="10" fill="#8a7a5c" font-style="italic">tiled roof of the west wing</text>
  <text x="750" y="450" text-anchor="middle" font-size="10" fill="#8a7a5c" font-style="italic">tiled roof of the east wing</text>
  <text x="450" y="666" text-anchor="middle" font-size="9.5" fill="#8a7a5c" font-style="italic">portico roof</text>

  <!-- ================= FLOOR FILLS ================= -->
  <rect x="42" y="60" width="192" height="120" fill="#e6d9bc"/>
  <rect x="234" y="60" width="336" height="120" fill="#e6d9bc"/>
  <rect x="42" y="180" width="528" height="72" fill="#e6d9bc"/>
  <rect x="258" y="252" width="384" height="384" fill="#c9b995"/>
  <circle cx="450" cy="444" r="192" fill="#e9dfc8"/>
  <circle cx="450" cy="444" r="120" fill="#372e22"/>

  <!-- ================= GRID ================= -->
  <rect x="42" y="60" width="192" height="120" fill="url(#grid)"/>
  <rect x="234" y="60" width="336" height="120" fill="url(#grid)"/>
  <rect x="42" y="180" width="528" height="72" fill="url(#grid)"/>
  <circle cx="450" cy="444" r="192" fill="url(#grid)"/>

  <!-- ================= WALLS & RAILS ================= -->
  <g fill="none" stroke="#4a3a28" stroke-width="5" stroke-linecap="square">
    <rect x="42" y="60" width="192" height="120"/>
    <rect x="234" y="60" width="336" height="120"/>
    <rect x="42" y="180" width="528" height="72"/>
    <circle cx="450" cy="444" r="192"/>
  </g>
  <circle cx="450" cy="444" r="120" fill="none" stroke="#8a6d3b" stroke-width="3.5" stroke-dasharray="10 5"/>
  <text x="450" y="436" text-anchor="middle" font-size="12" fill="#cdbf9e" font-style="italic">open to the rotunda</text>
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#cdbf9e" font-style="italic">below &#8212; 30 ft drop</text>

  <!-- skylight over the void -->
  <circle cx="450" cy="444" r="72" fill="none" stroke="#9c8ab5" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="450" y="480" text-anchor="middle" font-size="9.5" fill="#8a7aa5" font-style="italic">skylight in the roof directly above</text>

  <!-- ================= DOOR OPENINGS ================= -->
  <g>
    <rect x="88" y="172" width="50" height="16" fill="#e6d9bc"/>
    <rect x="316" y="172" width="50" height="16" fill="#e6d9bc"/>
    <rect x="424" y="240" width="52" height="24" fill="#e6d9bc"/>
  </g>
  <g stroke="#8a6d3b" stroke-width="2.5">
    <line x1="88" y1="180" x2="138" y2="180"/>
    <line x1="316" y1="180" x2="366" y2="180"/>
  </g>
  <!-- annex lock -->
  <rect x="333" y="160" width="16" height="13" rx="2" fill="#8a6d3b"/>
  <path d="M337 160 v-5 a4 4 0 0 1 8 0 v5" fill="none" stroke="#8a6d3b" stroke-width="2"/>

  <!-- ================= STAIR DOWN ================= -->
  <g stroke="#8a6d3b" stroke-width="1.5" fill="none">
    <line x1="192" y1="192" x2="276" y2="192"/><line x1="192" y1="204" x2="276" y2="204"/>
    <line x1="192" y1="216" x2="276" y2="216"/><line x1="192" y1="228" x2="276" y2="228"/>
    <line x1="192" y1="240" x2="276" y2="240"/>
  </g>
  <text x="234" y="188" text-anchor="middle" font-size="9" fill="#6a5537" font-style="italic">stairs down</text>

  <!-- ================= FURNITURE ================= -->
  <!-- label room: work tables, stencil shelves -->
  <rect x="60" y="84" width="60" height="24" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="60" y="132" width="60" height="24" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="180" y="72" width="42" height="16" fill="#b98d5f" stroke="#8a6d3b" stroke-width="1.5"/>

  <!-- sealed annex: shelf rows, reading table, brazier -->
  <g fill="#b98d5f" stroke="#8a6d3b" stroke-width="1.5">
    <rect x="252" y="72" width="132" height="14"/>
    <rect x="408" y="72" width="132" height="14"/>
    <rect x="252" y="104" width="132" height="14"/>
    <rect x="408" y="104" width="132" height="14"/>
  </g>
  <rect x="366" y="138" width="72" height="26" fill="#c9a06a" stroke="#8a6d3b" stroke-width="1.5"/>
  <circle cx="540" cy="152" r="9" fill="#a04a3a" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="540" y="170" text-anchor="middle" font-size="8" fill="#6a5537" font-style="italic">brazier</text>

  <!-- gallery ring display cases (rotated around the void) -->
  <g fill="#f6efdd" stroke="#8a6d3b" stroke-width="1.5">
    <rect x="588" y="432" width="40" height="18" transform="rotate(15 450 444)"/>
    <rect x="588" y="432" width="40" height="18" transform="rotate(75 450 444)"/>
    <rect x="588" y="432" width="40" height="18" transform="rotate(135 450 444)"/>
    <rect x="588" y="432" width="40" height="18" transform="rotate(195 450 444)"/>
    <rect x="588" y="432" width="40" height="18" transform="rotate(255 450 444)"/>
    <rect x="588" y="432" width="40" height="18" transform="rotate(315 450 444)"/>
  </g>

  <!-- ================= LABELS ================= -->
  <g fill="#6a5537" font-size="11.5" letter-spacing="1">
    <text x="56" y="78">LABEL ROOM</text>
    <text x="248" y="98" fill="#8a4a3a">SEALED ANNEX</text>
    <text x="56" y="200">CORRIDOR</text>
    <text x="450" y="286" text-anchor="middle">GALLERY OF THE VIOLET DUSK</text>
  </g>
  <text x="248" y="112" font-size="8.5" fill="#8a4a3a" font-style="italic">locked &#8212; restricted custody</text>
</svg>
