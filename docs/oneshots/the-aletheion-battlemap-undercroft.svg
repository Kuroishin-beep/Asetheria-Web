<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid" x="42" y="60" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#5a482f" stroke-width="0.7" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="760" height="700" fill="#e9e0cb"/>
  <text x="42" y="34" font-size="19" fill="#4a3a28" letter-spacing="2">THE ALETHEION &#8212; UNDERCROFT</text>
  <text x="718" y="34" text-anchor="end" font-size="12" fill="#7a6748" font-style="italic">1 square = 5 ft &#183; battle map, player-safe</text>

  <!-- ================= FLOOR FILLS ================= -->
  <rect x="42" y="60" width="240" height="192" fill="#ded0ae"/>
  <rect x="306" y="60" width="72" height="96" fill="#ded0ae"/>
  <rect x="282" y="156" width="48" height="144" fill="#ded0ae"/>
  <rect x="42" y="252" width="96" height="48" fill="#cfc2a2"/>
  <rect x="42" y="300" width="96" height="288" fill="#a8c8d6"/>
  <rect x="234" y="300" width="384" height="240" fill="#dcc9a0"/>

  <!-- water ripples -->
  <g stroke="#7da7b8" stroke-width="1.3" fill="none" opacity="0.8">
    <path d="M54 340 q10 -7 20 0 t20 0 t20 0 t20 0"/>
    <path d="M54 396 q10 -7 20 0 t20 0 t20 0 t20 0"/>
    <path d="M54 452 q10 -7 20 0 t20 0 t20 0 t20 0"/>
    <path d="M54 508 q10 -7 20 0 t20 0 t20 0 t20 0"/>
    <path d="M54 560 q10 -7 20 0 t20 0 t20 0 t20 0"/>
  </g>

  <!-- ================= GRID ================= -->
  <rect x="42" y="60" width="240" height="192" fill="url(#grid)"/>
  <rect x="306" y="60" width="72" height="96" fill="url(#grid)"/>
  <rect x="282" y="156" width="48" height="144" fill="url(#grid)"/>
  <rect x="42" y="252" width="96" height="48" fill="url(#grid)"/>
  <rect x="42" y="300" width="96" height="288" fill="url(#grid)"/>
  <rect x="234" y="300" width="384" height="240" fill="url(#grid)"/>

  <!-- ================= WALLS ================= -->
  <g fill="none" stroke="#4a3a28" stroke-width="5" stroke-linecap="square">
    <rect x="42" y="60" width="240" height="192"/>
    <rect x="306" y="60" width="72" height="96"/>
    <rect x="282" y="156" width="48" height="144"/>
    <rect x="42" y="252" width="96" height="48"/>
    <rect x="42" y="300" width="96" height="288"/>
    <rect x="234" y="300" width="384" height="240"/>
  </g>

  <!-- ================= OPENINGS ================= -->
  <g>
    <rect x="64" y="244" width="50" height="16" fill="#ded0ae"/>
    <rect x="64" y="292" width="50" height="16" fill="#cfc2a2"/>
    <rect x="306" y="148" width="24" height="16" fill="#ded0ae"/>
    <rect x="284" y="244" width="44" height="16" fill="#ded0ae"/>
    <rect x="284" y="292" width="44" height="16" fill="#dcc9a0"/>
  </g>
  <!-- bronze-faced vault door -->
  <g stroke="#8a6d3b" stroke-width="4"><line x1="284" y1="300" x2="328" y2="300"/></g>
  <text x="338" y="296" font-size="9" fill="#6a5537" font-style="italic">bronze-faced door</text>

  <!-- ================= STAIR UP ================= -->
  <g stroke="#8a6d3b" stroke-width="1.5" fill="none">
    <line x1="312" y1="78" x2="372" y2="78"/><line x1="312" y1="92" x2="372" y2="92"/>
    <line x1="312" y1="106" x2="372" y2="106"/><line x1="312" y1="120" x2="372" y2="120"/>
    <line x1="312" y1="134" x2="372" y2="134"/>
  </g>
  <text x="342" y="72" text-anchor="middle" font-size="9" fill="#6a5537" font-style="italic">stairs up</text>

  <!-- ================= STORAGE CRATES ================= -->
  <g fill="#d8c49a" stroke="#8a6d3b" stroke-width="1.5">
    <rect x="60" y="80" width="22" height="22"/><rect x="84" y="80" width="22" height="22"/><rect x="60" y="104" width="22" height="22"/>
    <rect x="150" y="92" width="22" height="22"/><rect x="174" y="92" width="22" height="22"/>
    <rect x="84" y="176" width="22" height="22"/><rect x="108" y="176" width="22" height="22"/><rect x="84" y="200" width="22" height="22"/>
    <rect x="192" y="164" width="22" height="22"/><rect x="216" y="164" width="22" height="22"/>
    <rect x="192" y="188" width="22" height="22"/><rect x="216" y="188" width="22" height="22"/>
    <rect x="246" y="80" width="22" height="22"/>
  </g>

  <!-- ================= THE BRONZE VAULT ================= -->
  <!-- display cases -->
  <g fill="#f6efdd" stroke="#8a6d3b" stroke-width="1.5">
    <rect x="246" y="318" width="18" height="60"/>
    <rect x="246" y="402" width="18" height="60"/>
    <rect x="588" y="318" width="18" height="60"/>
    <rect x="588" y="402" width="18" height="60"/>
    <rect x="300" y="510" width="60" height="18"/>
  </g>
  <!-- the sealed plinth -->
  <circle cx="426" cy="420" r="46" fill="none" stroke="#6b5b95" stroke-width="2"/>
  <circle cx="426" cy="420" r="36" fill="none" stroke="#6b5b95" stroke-width="2"/>
  <circle cx="426" cy="420" r="26" fill="none" stroke="#6b5b95" stroke-width="2"/>
  <circle cx="426" cy="420" r="16" fill="none" stroke="#6b5b95" stroke-width="2"/>
  <circle cx="426" cy="420" r="6" fill="#8a6d3b"/>
  <text x="426" y="486" text-anchor="middle" font-size="9.5" fill="#6b5b95" font-style="italic">the mirrored seal &#8212; four turning rings</text>

  <!-- the weeping bronze -->
  <circle cx="566" cy="496" r="22" fill="#8a6d3b" stroke="#6a5537" stroke-width="2"/>
  <path d="M560 502 q0 8 -3 12 M572 502 q0 8 3 12" stroke="#5f7d6a" stroke-width="2" fill="none"/>
  <text x="566" y="536" text-anchor="middle" font-size="9" fill="#6a5537" font-style="italic">bronze colossus head</text>

  <!-- ================= CISTERN GRATE ================= -->
  <g stroke="#4a3a28" stroke-width="2">
    <line x1="66" y1="580" x2="66" y2="596"/><line x1="76" y1="580" x2="76" y2="596"/>
    <line x1="86" y1="580" x2="86" y2="596"/><line x1="96" y1="580" x2="96" y2="596"/>
    <line x1="106" y1="580" x2="106" y2="596"/>
  </g>
  <text x="90" y="618" text-anchor="middle" font-size="9.5" fill="#33586b" font-style="italic">rusted grate &#8212; to the rain-cistern</text>

  <!-- ================= LABELS ================= -->
  <g fill="#6a5537" font-size="11.5" letter-spacing="1">
    <text x="54" y="76">STORAGE ROWS</text>
    <text x="90" y="560" transform="rotate(-90 90 560)" font-size="10.5" fill="#33586b">FLOODED PASSAGE &#8212; CHEST-DEEP</text>
    <text x="426" y="330" text-anchor="middle">THE BRONZE VAULT</text>
  </g>
</svg>
